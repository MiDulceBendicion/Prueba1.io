<!DOCTYPE html>
<html lang="es">
<head>

  <title>Para una madre maravillosa</title>
  <style>
    body {
      background: linear-gradient(to bottom right, #ffe0ec, #fff);
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding: 50px;
      color: #b4004e;
    }
    h1 {
      font-size: 2.8em;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.4em;
      margin: 10px 0;
    }
    .heart {
      font-size: 3em;
      color: #ff4d6d;
    }
  </style>
</head>
<body>
  <div class="heart">♥</div>
  <h1>¡Feliz Día de la Madre!</h1>
  <p>"No eres mamá… ¡pero eres una mamasita consagrada! Hermosa por fuera y aún más por dentro. Que Dios siga bendiciendo tu vida."</p>
  <p>🤣</p>
  <div class="heart">♥</div>
</body>
</html>
