<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Para una madre maravillosa</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #ffd6e0, #fff0f5);
      font-family: 'Quicksand', sans-serif;
      text-align: center;
      padding: 50px;
      color: #6a1b9a;
    }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 3em;
      color: #d81b60;
      text-shadow: 2px 2px #ffc1e3;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.3em;
      color: #4a148c;
      margin: 15px 0;
    }

    .heart {
      font-size: 3em;
      color: #f50057;
      animation: heartbeat 1s infinite;
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .galeria {
      margin-top: 40px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .galeria img {
      width: 150px;
      height: auto;
      border-radius: 15px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 3px solid #f8bbd0;
    }

    .galeria img:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      border-color: #f06292;
    }
  </style>
</head>
<body>
  <div class="heart">♥</div>
  <h1>¡Feliz Día de la Madre!</h1>
  <p>"No eres mamá… ¡pero eres una mamasita consagrada! Hermosa por fuera y aún más por dentro. Que Dios siga bendiciendo tu vida."</p>
  <p>🤣</p>
  <div class="heart">♥</div>

  <div class="galeria">
    <img src="imagenes/foto1.jpg" alt="Foto 1">
    <img src="imagenes/foto2.jpg" alt="Foto 2">
    <img src="imagenes/foto3.jpg" alt="Foto 3">
    <img src="imagenes/foto4.jpg" alt="Foto 4">
    <img src="imagenes/foto5.jpg" alt="Foto 5">
    <img src="imagenes/foto6.jpg" alt="Foto 6">

  </div>
</body>
</html>
